[package]
name = "staticgrind-effects"
version = "0.1.0"
edition = "2021"
description = "CPU destructive glitch effects — a direct port of frontend/src/effects/cpu.js, run in a Web Worker via WASM."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
